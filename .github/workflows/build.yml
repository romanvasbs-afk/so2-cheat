name: build

on:
  push:
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Build Dobby
        run: bash build_dobby.sh

      - name: Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: ldid
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid

      - name: Build dylib
        run: make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: s2chams
          path: .theos/**/s2chams.dylib
          if-no-files-found: error
          retention-days: 7
